services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: radiocafe
      POSTGRES_USER: radiocafe
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env antes de iniciar}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - radiocafe_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiocafe -d radiocafe"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  radiocafe_postgres:
