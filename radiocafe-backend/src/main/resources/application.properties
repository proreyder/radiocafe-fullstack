spring.application.name=radiocafe-backend
spring.profiles.default=demo
server.address=127.0.0.1
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
app.demo.enabled=false
app.cors.origins=http://localhost:5173,http://127.0.0.1:5173
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.images.directory=${PRODUCT_IMAGES_DIRECTORY:./uploads/products}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

springdoc.packages-to-scan=com.radiocafe.infrastructure.adapters.in.web
springdoc.paths-to-match=/api/v1/**
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
